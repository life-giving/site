    meta:
      title: ГО «Життєдайна» — права, безпека та підтримка жінок
      description: 'Жіноча громадська організація «Життєдайна»: захист прав, протидія насильству, психологічна та правова підтримка, жіноче лідерство. Львівська, Миколаївська та Херсонська області.'
