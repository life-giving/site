    lang_label: Мова сайту
    logo_alt: Життєдайна — логотип
    hero:
      title: Сила жінки — у праві на безпеку, гідність і власний вибір
      text: Ми захищаємо права, підтримуємо, навчаємо та посилюємо жінок, дітей і молодь — щоб вони могли долати наслідки насильства й війни та ставати активними творцями змін.
      btn_help: Як отримати допомогу
      btn_directions: Напрями роботи
      card_eyebrow: Безоплатна консультація
      card_title: Ви маєте право на безпеку
      card_note: Юристка та психологиня. Конфіденційно, без осуду, безоплатно. Пн–Пт, 09:00–18:00.
      emergency: У небезпеці прямо зараз — 102 (поліція) або 15-47 (урядова гаряча лінія).
    about:
      eyebrow: Про організацію
      title: Жіноча організація, яка діє поруч
      p1: "«Життєдайна» працює на перетині прав людини, гендерної рівності, захисту від насильства, правової та психологічної підтримки, жіночого лідерства й розвитку громад."
      p2: Ми не лише реагуємо на проблеми, а допомагаємо відновлювати впевненість, знати свої права та приймати власні рішення.
      stats:
      - value: 3
        text: області присутності, включно з прифронтовими громадами
      - value: 8
        text: напрямів роботи — від правової допомоги до лідерства
      - value: 9
        text: цінностей, за якими ми звітуємо перед людьми
      box_title: Напрями роботи
      box_items:
      - Захист прав жінок і дітей
      - Протидія насильству
      - Психологічна підтримка
      - Жіноче лідерство
      - Правова допомога
      - Робота з громадами
    directions:
      title: Напрями роботи
      hint: Натисніть напрям, щоб розгорнути перелік послуг.
      items:
      - title: Захист прав жінок і дівчат
        text: Правові консультації, представництво інтересів, супровід у взаємодії з поліцією, соціальними службами та судом.
      - title: Протидія насильству
        text: 'Допомога постраждалим від домашнього та гендерно зумовленого насильства: кризове реагування, безпечне планування, супровід.'
      - title: Психологічна підтримка
        text: Індивідуальні консультації, групи підтримки, робота з травмою та вигоранням.
      - title: Жіноче лідерство
        text: Навчальні програми, менторство та підтримка жіночих ініціатив у громадах.
      - title: Підтримка постраждалих від війни
        text: 'Робота з ВПО, родинами військових і мешканками прифронтових громад: гуманітарна, правова та психосоціальна допомога.'
      - title: Робота з молоддю та дітьми
        text: Профілактика насильства, безпечні простори, освітні заняття про права й межі.
      - title: Розвиток громад
        text: Співпраця з місцевою владою та організаціями, посилення спроможності громад реагувати на насильство.
      - title: Освіта та просвіта
        text: Тренінги, інформаційні кампанії, публічні події про права людини та гендерну рівність.
    mission:
      eyebrow: Наша місія
      text: Створювати умови, у яких кожна жінка має право на безпеку, гідність, свободу вибору та можливість змінювати власне життя і свою громаду.
      vision_eyebrow: Ми прагнемо громад, у яких
      vision_items:
      - немає толерантності до насильства
      - права людини є реальною цінністю
      - жінки мають голос і вплив на рішення
      - допомогу можна отримати в кризі
      - різноманітність сприймається як ресурс
    help:
      eyebrow: Крок за кроком
      title: Як отримати допомогу
      steps:
      - title: Зателефонуйте або напишіть
        text: Звернення конфіденційне. Ми не передаємо ваші дані третім особам без вашої згоди.
      - title: Розкажіть про ситуацію
        text: Координаторка вислухає й підбере потрібну підтримку — правову, психологічну, соціальну.
      - title: Отримайте супровід
        text: Ви самі вирішуєте темп і кроки. Ми супроводжуємо стільки, скільки потрібно.
      note: Ми ніколи не публікуємо історій і фото без письмової згоди людини.
      tone_label: Так
      tone_text: "«Ви маєте право на безпеку. Ми поруч і підкажемо наступний крок»."
      rule_label: Правило
    values:
      title: Наші цінності
      hint: 'Дев’ять принципів визначають зміст нашої роботи: як ми говоримо, що обіцяємо і за що відповідаємо.'
      items:
      - title: Гідність
        text: Кожна людина має право на повагу, безпеку та гідне життя.
      - title: Рівність
        text: Рівні права, можливості та доступ до ресурсів.
      - title: Безпека
        text: Безпечне середовище — фундамент відновлення.
      - title: Справедливість
        text: Захист прав людини та відповідальність.
      - title: Підтримка
        text: Ми поруч і допомагаємо відновити власну силу.
      - title: Жіноче лідерство
        text: Жінки — лідерки та експертки змін.
      - title: Партнерство
        text: Стійкі зміни створюються через довіру.
      - title: Професійність
        text: Знання, досвід і доказові підходи.
      - title: Відповідальність
        text: Перед людьми, ресурсами й результатами.
    transparency:
      eyebrow: Прозорість
      title: Звітність і партнерство
      p1: 'Ми щороку публікуємо фінансовий та програмний звіт: скільком людям надано допомогу, які проєкти реалізовано, як використано кошти донорів.'
      p2: Донори, громади та організації можуть звертатися до нас напряму — контакти нижче.
      size: PDF · %{size} МБ
      empty: Документи готуються.
